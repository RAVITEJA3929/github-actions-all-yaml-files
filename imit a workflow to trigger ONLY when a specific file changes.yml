name: Matrix Jobs

on:
  push:
    paths:
      - '.github/workflows/matrix.yml' # Only runs when matrix.yml itself changes!
      # - 'src/**'                    # You can also add specific app folders here

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: echo "Testing on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
