name: Sequential Jobs

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building artifact..."

  test:
    runs-on: ubuntu-latest
    needs: build # Waits for 'build' to succeed
    steps:
      - run: echo "Testing build..."

  deploy:
    runs-on: ubuntu-latest
    needs: test # Waits for 'test' to succeed
    steps:
      - run: echo "Deploying to production..."
